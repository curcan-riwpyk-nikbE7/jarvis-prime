<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Holo-Sphere</title>
    <!-- Three.js для кинематографичной 3D-графики частиц -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Consolas', sans-serif;
            user-select: none;
        }

        /* Полная прозрачность и перетаскивание окна */
        body {
            background: transparent;
            color: #e0f7fa;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        /* Область для перетаскивания безрамочного окна по экрану */
        .drag-zone {
            position: absolute;
            top: 0; left: 0; right: 0; height: 50px;
            -webkit-app-region: drag;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 25px;
        }

        .brand-holo {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #00f0ff;
            text-shadow: 0 0 15px #00f0ff, 0 0 30px rgba(0, 240, 255, 0.6);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hud-status-badge {
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(0, 240, 255, 0.7);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(0, 240, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .controls-top {
            display: flex;
            gap: 12px;
            -webkit-app-region: no-drag;
        }

        .btn-holo {
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.4);
            color: #80d8ff;
            font-size: 11px;
            letter-spacing: 1px;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.3s;
        }

        .btn-holo:hover {
            background: #00f0ff;
            color: #030811;
            box-shadow: 0 0 20px #00f0ff;
            transform: scale(1.05);
        }

        /* 3D холст WebGL на весь экран */
        #webgl-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: all;
        }

        /* Всплывающие голографические титры прямо в пространстве */
        .holo-overlay {
            position: absolute;
            top: 60px;
            width: 85%;
            max-width: 750px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            pointer-events: none;
        }

        .speech-bubble {
            background: rgba(3, 15, 30, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.2), inset 0 0 20px rgba(0, 240, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 14px;
            padding: 16px 26px;
            color: #e0f7fa;
            font-size: 15px;
            line-height: 1.6;
            text-align: center;
            letter-spacing: 0.5px;
            max-width: 100%;
            pointer-events: all;
            animation: holoIn 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
            position: relative;
        }

        .speech-bubble::before {
            content: 'J.A.R.V.I.S.';
            display: block;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #00f0ff;
            margin-bottom: 6px;
            text-shadow: 0 0 10px #00f0ff;
        }

        @keyframes holoIn {
            from { opacity: 0; transform: translateY(-15px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Нижний блок управления */
        .bottom-bar {
            position: absolute;
            bottom: 25px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 650px;
        }

        .quick-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .action-chip {
            background: rgba(3, 15, 30, 0.65);
            border: 1px solid rgba(0, 240, 255, 0.25);
            color: #80d8ff;
            font-size: 11px;
            padding: 6px 14px;
            border-radius: 16px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
        }

        .action-chip:hover {
            border-color: #00f0ff;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            transform: translateY(-2px);
        }

        .input-holo-box {
            display: flex;
            width: 100%;
            background: rgba(3, 15, 30, 0.7);
            border: 1px solid rgba(0, 240, 255, 0.35);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 6px 10px 6px 20px;
            align-items: center;
            transition: all 0.3s;
        }

        .input-holo-box:focus-within {
            border-color: #00f0ff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
        }

        .input-holo {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            letter-spacing: 0.5px;
        }

        .btn-voice-trigger {
            background: linear-gradient(135deg, #00f0ff, #0077ff);
            border: none;
            color: #030811;
            font-weight: 900;
            padding: 10px 22px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            transition: all 0.2s;
        }

        .btn-voice-trigger:hover {
            box-shadow: 0 0 25px #00f0ff;
            transform: scale(1.05);
        }

        .btn-voice-trigger.pulse-listen {
            background: linear-gradient(135deg, #ffb300, #ff5722);
            color: #ffffff;
            box-shadow: 0 0 30px #ffb300;
            animation: pulseBtn 1s infinite alternate;
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }
    </style>
</head>
<body>

    <!-- Зона перетаскивания и статус -->
    <div class="drag-zone">
        <div class="brand-holo">
            <span>⚡ J.A.R.V.I.S. PRIME</span>
            <span class="hud-status-badge" id="hud-status">HOLO-3D CORE // READY</span>
        </div>
        <div class="controls-top">
            <button class="btn-holo" onclick="toggleMinimize()">— СВЕРНУТЬ</button>
            <button class="btn-holo" style="border-color: #ff5252; color: #ff8a80;" onclick="closeApp()">✕</button>
        </div>
    </div>

    <!-- 3D Canvas WebGL -->
    <div id="webgl-container"></div>

    <!-- Голографический текст Джарвиса -->
    <div class="holo-overlay">
        <div class="speech-bubble" id="speech-bubble">
            Все протоколы активированы, сэр. Я подключен к вашей системе. Назовите команду или скажите «Джарвис».
        </div>
    </div>

    <!-- Нижняя панель действий -->
    <div class="bottom-bar">
        <div class="quick-actions">
            <div class="action-chip" onclick="sendQuick('Посмотри на экран и скажи, что здесь открыто')">👁️ Взгляни на экран</div>
            <div class="action-chip" onclick="sendQuick('Наведи порядок на рабочем столе')">🧹 Наведи порядок</div>
            <div class="action-chip" onclick="sendQuick('Сделай звук погромче')">🔊 Прибавь звук</div>
            <div class="action-chip" onclick="sendQuick('Включи саундтрек Iron Man')">🎵 Музыка</div>
            <div class="action-chip" onclick="sendQuick('Обрежь первые 30 секунд у видео')">✂️ Нарезать видео</div>
        </div>

        <div class="input-holo-box">
            <input type="text" class="input-holo" id="cmd-input" placeholder="Скажите «Джарвис» или введите команду..." onkeydown="if(event.key==='Enter') sendText()">
            <button class="btn-voice-trigger" id="voice-btn" onclick="toggleVoice()">🎙️ МИКРОФОН</button>
        </div>
    </div>

    <script>
        // ==========================================
        // НАСТОЯЩЕЕ 3D ЯДРО НА THREE.JS (3500 ЧАСТИЦ)
        // ==========================================
        let scene, camera, renderer, particleSphere, innerRings = [];
        let isSpeaking = false;
        let isListening = false;
        let mouseX = 0, mouseY = 0;

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.z = 220;

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);
            renderer.domElement.id = 'webgl-canvas';

            // Создаем 3D-сферу из частиц
            const particleCount = 2800;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            const colorBase = new THREE.Color(0x00f0ff);

            for (let i = 0; i < particleCount; i++) {
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = 85 + (Math.random() - 0.5) * 12;

                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);

                colors[i * 3] = colorBase.r;
                colors[i * 3 + 1] = colorBase.g;
                colors[i * 3 + 2] = colorBase.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 2.2,
                vertexColors: true,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending
            });

            particleSphere = new THREE.Points(geometry, material);
            scene.add(particleSphere);

            // Создаем 3D неоновые кольца вокруг ядра
            for (let i = 0; i < 3; i++) {
                const ringGeo = new THREE.RingGeometry(95 + i * 16, 96 + i * 16, 64);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: 0x00f0ff,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.4 - i * 0.1,
                    blending: THREE.AdditiveBlending
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / (2 + i);
                ring.rotation.y = (i * Math.PI) / 3;
                scene.add(ring);
                innerRings.push(ring);
            }

            // Интерактивное слежение за мышью
            window.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX - window.innerWidth / 2) * 0.001;
                mouseY = (e.clientY - window.innerHeight / 2) * 0.001;
            });

            window.addEventListener('resize', onWindowResize);
            animate3D();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        let clock = new THREE.Clock();

        function animate3D() {
            requestAnimationFrame(animate3D);
            const time = clock.getElapsedTime();

            // Вращение ядра с реакцией на мышь
            particleSphere.rotation.y += 0.004;
            particleSphere.rotation.x += 0.002;

            particleSphere.rotation.y += (mouseX - particleSphere.rotation.y) * 0.05;
            particleSphere.rotation.x += (mouseY - particleSphere.rotation.x) * 0.05;

            // Вращение колец
            innerRings.forEach((ring, idx) => {
                ring.rotation.z += 0.005 * (idx % 2 === 0 ? 1 : -1);
                ring.rotation.x += 0.003;
            });

            // Пульсация звука
            let scaleTarget = 1;
            if (isSpeaking) {
                scaleTarget = 1 + Math.sin(time * 18) * 0.12;
            } else if (isListening) {
                scaleTarget = 1 + Math.sin(time * 8) * 0.05;
            }
            particleSphere.scale.lerp(new THREE.Vector3(scaleTarget, scaleTarget, scaleTarget), 0.1);

            renderer.render(scene, camera);
        }

        init3D();

        // ==========================================
        // ИНТЕРФЕЙСНЫЕ МОСТЫ К PYTHON
        // ==========================================
        function setHoloMessage(text, isSpeakingState=false) {
            const bubble = document.getElementById('speech-bubble');
            bubble.innerHTML = text;
            isSpeaking = isSpeakingState;

            // Меняем цвет частиц на оранжевый во время речи
            const colors = particleSphere.geometry.attributes.color.array;
            const targetColor = isSpeakingState ? new THREE.Color(0xff6d00) : (isListening ? new THREE.Color(0xffb300) : new THREE.Color(0x00f0ff));
            for (let i = 0; i < colors.length / 3; i++) {
                colors[i * 3] = targetColor.r;
                colors[i * 3 + 1] = targetColor.g;
                colors[i * 3 + 2] = targetColor.b;
            }
            particleSphere.geometry.attributes.color.needsUpdate = true;
        }

        function setStatus(text, listening=false, speaking=false) {
            document.getElementById('hud-status').innerText = text;
            isListening = listening;
            isSpeaking = speaking;
            const btn = document.getElementById('voice-btn');
            if (listening) {
                btn.classList.add('pulse-listen');
                btn.innerText = '🔴 СЛУШАЮ...';
            } else {
                btn.classList.remove('pulse-listen');
                btn.innerText = '🎙️ МИКРОФОН';
            }

            const colors = particleSphere.geometry.attributes.color.array;
            const targetColor = listening ? new THREE.Color(0xffb300) : (speaking ? new THREE.Color(0xff5722) : new THREE.Color(0x00f0ff));
            for (let i = 0; i < colors.length / 3; i++) {
                colors[i * 3] = targetColor.r;
                colors[i * 3 + 1] = targetColor.g;
                colors[i * 3 + 2] = targetColor.b;
            }
            particleSphere.geometry.attributes.color.needsUpdate = true;
        }

        function toggleVoice() {
            if (window.pywebview) {
                window.pywebview.api.trigger_listen();
            }
        }

        function sendText() {
            const input = document.getElementById('cmd-input');
            const val = input.value.trim();
            if (val) {
                input.value = '';
                setHoloMessage(val, false);
                if (window.pywebview) {
                    window.pywebview.api.send_command(val);
                }
            }
        }

        function sendQuick(prompt) {
            setHoloMessage(prompt, false);
            if (window.pywebview) {
                window.pywebview.api.send_command(prompt);
            }
        }

        function toggleMinimize() {
            if (window.pywebview) window.pywebview.api.minimize_app();
        }

        function closeApp() {
            if (window.pywebview) window.pywebview.api.close_app();
        }
    </script>
</body>
</html>
